<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Settings</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        --brand: #0d9488;
        --brand-ink: #0f766e;
        --brand-soft: #ccfbf1;
        --ink: #0f172a;
        --muted: #64748b;
        --line: #e2e8f0;
        --surface: #ffffff;
        --page: #f8fafc;
      }
      body {
        margin: 0;
        color: var(--ink);
        background: var(--page);
      }
      main {
        max-width: 680px;
        margin: 0 auto;
        padding: 36px 20px 64px;
      }
      .hero {
        display: flex;
        gap: 14px;
        align-items: center;
        margin-bottom: 24px;
      }
      .hero img {
        width: 48px;
        height: 48px;
        border-radius: 12px;
      }
      h1 {
        margin: 0 0 6px;
        font-size: 24px;
        color: var(--brand-ink);
      }
      .lead {
        margin: 0;
        color: var(--muted);
        line-height: 1.6;
      }
      .section {
        margin-bottom: 16px;
        padding: 16px 18px;
        border-radius: 12px;
        background: var(--surface);
        border: 1px solid var(--line);
      }
      .section h2 {
        margin: 0 0 12px;
        font-size: 14px;
        color: var(--brand-ink);
      }
      .guide ol {
        margin: 0;
        padding-left: 20px;
        color: #475569;
        line-height: 1.7;
        font-size: 14px;
      }
      .guide a { color: var(--brand-ink); }
      .lang-box {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }
      .lang {
        border: 1px solid var(--line);
        background: var(--surface);
        border-radius: 8px;
        padding: 7px 10px;
        font-size: 12px;
        color: var(--muted);
        cursor: pointer;
      }
      .lang.active {
        background: var(--brand-soft);
        color: var(--brand-ink);
        border-color: transparent;
      }
      label {
        display: block;
        margin: 14px 0 6px;
        font-size: 13px;
        font-weight: 600;
      }
      label:first-of-type { margin-top: 0; }
      input {
        width: 100%;
        box-sizing: border-box;
        padding: 10px 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--surface);
        font-size: 14px;
        color: var(--ink);
      }
      .actions {
        margin-top: 16px;
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }
      button.primary, button.secondary {
        border: 0;
        border-radius: 8px;
        padding: 10px 14px;
        cursor: pointer;
        font-size: 14px;
      }
      button.primary {
        background: var(--brand);
        color: #fff;
      }
      button.primary:hover { background: var(--brand-ink); }
      button.secondary {
        background: #f1f5f9;
        color: var(--ink);
      }
      #message {
        margin-top: 14px;
        font-size: 13px;
        color: var(--brand-ink);
        min-height: 1.2em;
      }
      .hint {
        font-size: 12px;
        color: var(--muted);
        margin-top: 4px;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="hero">
        <img src="../icons/icon128.png" alt="" />
        <div>
          <h1 id="title">Settings</h1>
          <p id="lead" class="lead"></p>
        </div>
      </div>

      <section class="section">
        <h2 id="section_language_title"></h2>
        <div class="lang-box" aria-label="Language">
          <button id="lang_auto" class="lang" type="button">Auto</button>
          <button id="lang_zh" class="lang" type="button">中文</button>
          <button id="lang_en" class="lang" type="button">EN</button>
        </div>
      </section>

      <section class="section guide">
        <h2 id="guide_title"></h2>
        <ol>
          <li id="guide_1"></li>
          <li id="guide_2"></li>
          <li id="guide_3"></li>
          <li id="guide_4"></li>
          <li id="guide_5"></li>
        </ol>
      </section>

      <section class="section">
        <h2 id="section_tokens_title"></h2>
        <label id="label_gitee" for="gitee_token"></label>
        <input id="gitee_token" type="password" autocomplete="off" />
        <div id="hint_gitee" class="hint"></div>

        <label id="label_github" for="github_token"></label>
        <input id="github_token" type="password" autocomplete="off" />
      </section>

      <section class="section">
        <h2 id="section_poll_title"></h2>
        <label id="label_poll" for="poll_interval_minutes"></label>
        <input id="poll_interval_minutes" type="number" min="10" max="60" />

        <div class="actions">
          <button id="save" class="primary" type="button"></button>
          <button id="check" class="secondary" type="button"></button>
        </div>
        <div id="message"></div>
      </section>
    </main>
    <script src="./index.js"></script>
  </body>
</html>
