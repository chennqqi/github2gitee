<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GitHub → Gitee</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        --brand: #0d9488;
        --brand-ink: #0f766e;
        --ink: #0f172a;
        --muted: #64748b;
        --line: #e2e8f0;
        --surface: #ffffff;
        --page: #f8fafc;
      }
      body {
        margin: 0;
        width: 380px;
        min-height: 280px;
        color: var(--ink);
        background: var(--page);
      }
      header {
        padding: 12px 14px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        border-bottom: 1px solid var(--line);
        background: var(--surface);
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .brand img {
        width: 28px;
        height: 28px;
        border-radius: 8px;
      }
      h1 {
        margin: 0;
        font-size: 13px;
        color: var(--brand-ink);
      }
      .sub {
        margin: 2px 0 0;
        font-size: 11px;
        color: var(--muted);
      }
      .tools {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      a.linkish, button.linkish {
        color: var(--brand-ink);
        font-size: 11px;
        background: none;
        border: 0;
        padding: 0;
        cursor: pointer;
        text-decoration: none;
      }
      main { padding: 12px 14px 16px; }
      .hint, .empty {
        font-size: 12px;
        color: var(--muted);
      }
      .hint { margin: 0 0 10px; line-height: 1.5; }
      .section-title {
        margin: 0 0 8px;
        font-size: 12px;
        font-weight: 650;
        color: var(--brand-ink);
      }
      .card {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 10px 12px;
      }
      ul { list-style: none; margin: 0; padding: 0; }
      li {
        padding: 10px 0;
        border-bottom: 1px solid var(--line);
      }
      li:last-child { border-bottom: 0; }
      .title { font-size: 13px; font-weight: 600; }
      .meta {
        margin-top: 4px;
        font-size: 11px;
        color: var(--muted);
        word-break: break-word;
      }
      button.action {
        margin-top: 8px;
        margin-right: 6px;
        border: 1px solid var(--line);
        background: var(--surface);
        border-radius: 8px;
        padding: 5px 9px;
        font-size: 11px;
        color: #334155;
        cursor: pointer;
      }
      button.action.primary {
        background: var(--brand);
        color: #fff;
        border-color: transparent;
      }
      .register {
        margin-top: 10px;
      }
      .register .title { margin-bottom: 6px; }
      .register input {
        width: 100%;
        box-sizing: border-box;
        margin: 4px 0;
        padding: 8px 10px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--surface);
        color: var(--ink);
      }
    </style>
  </head>
  <body>
    <header>
      <div class="brand">
        <img src="../icons/icon48.png" alt="" />
        <div>
          <h1 id="title">Mappings</h1>
          <p class="sub" id="token-status">…</p>
        </div>
      </div>
      <div class="tools">
        <button id="poll_now" class="linkish" type="button">Check</button>
        <a id="settings_link" class="linkish" href="../options/index.html" target="_blank" rel="noreferrer">Settings</a>
      </div>
    </header>
    <main>
      <p id="hint" class="hint"></p>
      <div class="section-title" id="mappings_heading"></div>
      <div class="card">
        <div id="list-root" class="empty"></div>
      </div>
      <div class="card register">
        <div class="title" id="register_title"></div>
        <input id="reg_github" />
        <input id="reg_gitee_repo" />
        <button id="reg_btn" class="action primary" type="button"></button>
      </div>
    </main>
    <script src="./index.js"></script>
  </body>
</html>
